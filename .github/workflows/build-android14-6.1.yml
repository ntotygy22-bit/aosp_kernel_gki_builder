name: 🏗️ BUILD ANDROID14-6.1

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    
    env:
      LLVM: 1
      LLVM_IAS: 1
      LD: ld.lld
      CC: clang
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1

    - name: Setup Environment
      run: |
        sudo apt update
        sudo apt install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler rename libelf-dev dwarves libncurses-dev clang lld llvm

    - name: Read Configuration
      run: |
        CONFIG_ENV=config.properties.gki_1461
        echo "KERNEL_SOURCE=$(cat $CONFIG_ENV | grep -w "KERNEL_SOURCE" | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=$(cat $CONFIG_ENV | grep -w "KERNEL_CONFIG" | cut -d "=" -f 2)" >> $GITHUB_ENV
        echo "DISABLE_LTO=$(cat $CONFIG_ENV | grep -w "DISABLE-LTO" | cut -d "=" -f 2)" >> $GITHUB_ENV

    - name: Download Kernel Source
      run: |
        mkdir -p kernel_workspace
        cd kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b main android-kernel --depth=1

    - name: Build Kernel
      run: |
        cd kernel_workspace/android-kernel
        
        # 1. Generate config awal
        make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
        
        # 2. PATCH PAKSA: Pake tool resmi kernel buat set VA_BITS ke 39
        # Hapus opsi VA_BITS lama dan paksa pakai 39
        ./scripts/config --file out/.config -d CONFIG_ARM64_VA_BITS_47
        ./scripts/config --file out/.config -d CONFIG_ARM64_VA_BITS_48
        ./scripts/config --file out/.config -d CONFIG_ARM64_VA_BITS_52
        ./scripts/config --file out/.config -e CONFIG_ARM64_VA_BITS_39
        
        # Sync config agar struktur kernel rapi
        make O=out ARCH=arm64 olddefconfig
        
        # 3. Handling LTO jika DISABLE-LTO=true
        if [ "${{ env.DISABLE_LTO }}" = "true" ]; then
            ./scripts/config --file out/.config -d CONFIG_LTO
            ./scripts/config --file out/.config -e CONFIG_LTO_NONE
        fi
        
        # 4. Kompilasi utama
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Output
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image*
